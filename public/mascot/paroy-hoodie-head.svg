<svg xmlns="http://www.w3.org/2000/svg" viewBox="77 40 358 358" width="358" height="358">
  <defs>
    <radialGradient id="hood" cx="0.35" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#C08BFF"/>
      <stop offset="0.4" stop-color="#8A3FF2"/>
      <stop offset="0.8" stop-color="#4A1CA8"/>
      <stop offset="1" stop-color="#26105E"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.42" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF6F0"/>
      <stop offset="0.55" stop-color="#FFE0D0"/>
      <stop offset="1" stop-color="#EDB9A4"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#ECE8FA"/>
      <stop offset="1" stop-color="#B3A8DD"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFB3D6"/>
      <stop offset="0.45" stop-color="#FF2E86"/>
      <stop offset="1" stop-color="#7A0036"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimAll" gradientUnits="userSpaceOnUse" x1="86" y1="0" x2="426" y2="0">
      <stop offset="0" stop-color="#FF2E9A" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#FF2E9A" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="erode6" x="-5%" y="-5%" width="110%" height="110%"><feMorphology operator="erode" radius="6"/></filter>
    <mask id="rimMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path fill="#fff" d="M92 300 C 80 150, 170 62, 262 62 C 360 62, 436 150, 420 300 C 414 350, 380 376, 340 380 L 172 380 C 130 376, 96 346, 92 300 Z"/>
      <path fill="#000" filter="url(#erode6)" d="M92 300 C 80 150, 170 62, 262 62 C 360 62, 436 150, 420 300 C 414 350, 380 376, 340 380 L 172 380 C 130 376, 96 346, 92 300 Z"/>
    </mask>
    <clipPath id="faceClip"><ellipse cx="256" cy="252" rx="108" ry="100"/></clipPath>
  </defs>

  <!-- hood (rounded off at the bottom: no body below it in the icon) -->
  <path d="M92 300 C 80 150, 170 62, 262 62 C 360 62, 436 150, 420 300 C 414 350, 380 376, 340 380 L 172 380 C 130 376, 96 346, 92 300 Z" fill="url(#hood)"/>
  <ellipse cx="190" cy="120" rx="80" ry="28" transform="rotate(-22 190 120)" fill="url(#shine)" opacity="0.45" filter="url(#blur4)"/>
  <path d="M118 196 C 110 240, 116 290, 142 330" fill="none" stroke="#FF2E9A" stroke-width="3" stroke-linecap="round" filter="url(#glowMagenta)"/>
  <path d="M394 196 C 402 240, 396 290, 370 330" fill="none" stroke="#FF2E9A" stroke-width="3" stroke-linecap="round" filter="url(#glowMagenta)"/>
  <ellipse cx="256" cy="246" rx="130" ry="124" fill="#140A2E"/>

  <!-- face -->
  <ellipse cx="256" cy="252" rx="108" ry="100" fill="url(#skin)"/>
  <g clip-path="url(#faceClip)">
    <ellipse cx="256" cy="150" rx="140" ry="40" fill="#3A1F7A" opacity="0.35" filter="url(#blur10)"/>
  </g>

  <!-- eyes -->
  <ellipse cx="212" cy="270" rx="25" ry="29" fill="#FFFFFF"/>
  <ellipse cx="300" cy="270" rx="25" ry="29" fill="#FFFFFF"/>
  <ellipse cx="214" cy="274" rx="19" ry="24" fill="url(#iris)"/>
  <ellipse cx="302" cy="274" rx="19" ry="24" fill="url(#iris)"/>
  <ellipse cx="215" cy="278" rx="7" ry="12" fill="#2A0A1E"/>
  <ellipse cx="303" cy="278" rx="7" ry="12" fill="#2A0A1E"/>
  <ellipse cx="206" cy="262" rx="7" ry="8" fill="#FFFFFF"/>
  <ellipse cx="294" cy="262" rx="7" ry="8" fill="#FFFFFF"/>
  <circle cx="222" cy="288" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="310" cy="288" r="3" fill="#FFFFFF" opacity="0.9"/>
  <path d="M184 256 Q 212 234 240 252" fill="none" stroke="#2A1740" stroke-width="6" stroke-linecap="round"/>
  <path d="M272 252 Q 300 234 328 256" fill="none" stroke="#2A1740" stroke-width="6" stroke-linecap="round"/>

  <!-- blush + mouth -->
  <ellipse cx="190" cy="308" rx="16" ry="8" fill="#FF6FA8" opacity="0.4"/>
  <ellipse cx="322" cy="308" rx="16" ry="8" fill="#FF6FA8" opacity="0.4"/>
  <path d="M244 318 Q 256 328 268 318" fill="none" stroke="#9A3E55" stroke-width="3.5" stroke-linecap="round"/>

  <!-- hair (bangs) -->
  <path d="M138 252 C 134 172, 190 120, 258 118 C 330 118, 382 170, 376 254 L 360 236 L 352 272 L 334 222 L 316 252 L 302 206 L 282 246 L 260 200 L 240 246 L 220 208 L 206 252 L 186 222 L 170 274 L 160 236 Z" fill="url(#hair)"/>
  <path d="M200 150 C 230 136, 280 134, 318 150" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M168 200 L 182 176 M338 196 L 326 172" stroke="#9A8FD0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- hood rim framing the face -->
  <ellipse cx="256" cy="246" rx="130" ry="124" fill="none" stroke="#B57BFF" stroke-width="10"/>
  <ellipse cx="256" cy="246" rx="123" ry="117" fill="none" stroke="#FF2E9A" stroke-width="2.5" filter="url(#glowMagenta)"/>

  <!-- neon rim on the outer silhouette -->
  <rect x="0" y="0" width="512" height="512" fill="url(#rimAll)" mask="url(#rimMask)" filter="url(#soft)"/>
</svg>
